# ecomback docker compose
version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecomback
    ports:
      - "3306:3306"

  app:
    image: ecomback:1.0
    container_name: ecomback-container
    depends_on:
      - mysql
    ports:
      - "9090:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ecomback
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    restart: on-failure

frontend:
    build: ./PFA_Nermine-Ala-Amine-main
    container_name: frontend-container
    ports:
      - "3000:80"
    depends_on:
      - app